# infra/docker-compose.yml
# Local infrastructure cho dev. Chạy từ project root:
#   docker compose -f infra/docker-compose.yml up -d
#
# T3-T4: Postgres + Kafka (KRaft mode).
# MLflow tracking server tạm chạy host process: `mlflow ui --port 5000 \
#   --backend-store-uri ml/notebooks/mlruns`. Dockerize sau cùng (T7).

services:
  postgres:
    image: postgres:15-alpine
    container_name: monitoring-postgres
    environment:
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring
      POSTGRES_DB: monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # WHY healthcheck: backend cần đợi postgres ready trước khi connect.
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: monitoring-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (no Zookeeper) — combined node = controller + broker.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # WHY replication=1 + min_isr=1: 1 broker dev. Không set thì broker
      # tự fail khi internal topics (offset, txn) cần replication > 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # WHY giới hạn heap: EC2 t3.micro chỉ có 1GB RAM. Local dev cũng nhẹ.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
