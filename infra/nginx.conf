# nginx config cho frontend container.
# - Serve SPA static, fallback index.html cho client-side routing.
# - Reverse-proxy /api/ + /ws/ về backend service → same-origin, không CORS.
# - WebSocket upgrade pass-through cho /ws/predictions.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: mọi route không match file → index.html (React Router handle).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy: axios call /api/... → forward backend:8000/api/...
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket upgrade — /ws/predictions là endpoint backend (xem
    # backend/app/api/websocket.py). Cần Upgrade headers.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health endpoint cho healthcheck container (nginx tự reply 200).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
