# infra/docker-compose.aws.yml
#
# Compose cho EC2 t3.micro deploy.
# Khác `docker-compose.prod.yml`:
#  - Pull image từ GHCR (KHÔNG build trên EC2 — 1GB RAM OOM khi compile xgboost)
#  - BỎ service postgres → dùng RDS external (DATABASE_URL trỏ RDS endpoint)
#  - KHÔNG mount ../ml/data → retrain subprocess tự pull từ S3 (boto3)
#
# Prerequisites trên EC2:
#  - Docker + docker compose plugin
#  - File này + .env.prod ở cùng folder
#  - IAM role EC2 có quyền s3:GetObject + s3:ListBucket trên bucket data
#    (hoặc set AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY trong .env.prod)
#
# Lệnh chạy trên EC2:
#   docker compose -f docker-compose.aws.yml --env-file .env.prod pull
#   docker compose -f docker-compose.aws.yml --env-file .env.prod up -d
#
# Bootstrap MLflow alias (1 lần):
#   Train trên laptop dev → register lên MLflow EC2:
#     MLFLOW_TRACKING_URI=http://<ec2-ip>:5000 python -m ml.src.train --register
#   Mở http://<ec2-ip>:5000 → set alias `production` cho version 1.
#   Restart backend: docker compose -f docker-compose.aws.yml restart backend

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: sepsis-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # WHY heap nhỏ hơn prod: EC2 t3.micro chỉ 1GB RAM total, share với backend
      # + frontend + mlflow. Nếu OOM thì hạ tiếp xuống 192m.
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mlflow:
    image: ghcr.io/minhnguyen1007/sepsis-mlflow:latest
    container_name: sepsis-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend:
    image: ghcr.io/minhnguyen1007/sepsis-backend:latest
    container_name: sepsis-backend
    depends_on:
      kafka:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      # DATABASE_URL TRỎ RDS — đặt full URL trong .env.prod
      # vd: postgresql+asyncpg://user:pass@xxx.rds.amazonaws.com:5432/monitoring
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_VITALS: ${KAFKA_TOPIC_VITALS:-patient-vitals}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-backend-consumer}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-sepsis-predictor}
      MODEL_ALIAS: ${MODEL_ALIAS:-production}
      MODEL_THRESHOLD: ${MODEL_THRESHOLD:-0.70}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
      DRIFT_FEATURES_THRESHOLD: ${DRIFT_FEATURES_THRESHOLD:-0.30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # --- AWS S3 cho retrain pull PhysioNet data ---
      # Ưu tiên: dùng IAM role EC2 (không set 2 key dưới). Fallback: long-lived key.
      S3_DATA_BUCKET: ${S3_DATA_BUCKET}
      S3_DATA_PREFIX: ${S3_DATA_PREFIX:-physionet/}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      # Cache data đã pull từ S3 — survive container restart, retrain không pull lại.
      - ml_data:/app/ml/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/models/current/info || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    image: ghcr.io/minhnguyen1007/sepsis-frontend:latest
    container_name: sepsis-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  kafka_data:
  mlflow_data:
  ml_data:
