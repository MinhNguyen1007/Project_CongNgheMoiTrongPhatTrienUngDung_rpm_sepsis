# Alembic config — đặt ở project root để chạy `alembic upgrade head` từ root.
# DATABASE_URL được override bởi env var (qua .env loaded trong env.py).

[alembic]
script_location = backend/app/alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url để trống — env.py load từ backend.app.config.settings.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
