# CI workflow cho sepsis monitoring stack.
#
# Jobs:
#   lint        - ruff + black --check (Python)
#   test        - pytest backend/ + ml/ (9 test, không cần DB thật)
#   frontend    - tsc -b --noEmit
#   build-push  - build 3 Docker image push GHCR (chỉ chạy push main)
#
# Trigger: push main + PR vào main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# WHY concurrency: PR push liên tục → cancel run cũ, tiết kiệm minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff==0.6.* black==24.*

      - name: ruff check
        run: ruff check .

      - name: black --check
        run: black --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        # WHY full requirements: test import mlflow/xgboost/evidently → cần đầy đủ.
        # Cài mất ~2 phút, cache pip cứu trip kế.
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        env:
          # Pytest không thực sự kết nối, nhưng config validate URL khi load.
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: pytest -v --tb=short

  frontend:
    name: Frontend TS check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: TS check
        run: npm run lint

  build-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    # WHY chỉ push main: PR không có quyền push lên GHCR (fork), và tránh
    # rác tag từ branch dev.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # WHY 3 step build riêng thay vì matrix: docker meta + build action
      # nhận 1 image/run. Matrix expand tag template phức tạp hơn.
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sepsis-backend:latest
            ghcr.io/${{ github.repository_owner }}/sepsis-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.frontend
          push: true
          # WHY build-args: Vite bake env vào bundle. CI build mặc định cho local
          # demo; deploy AWS sau rebuild với hostname thực.
          build-args: |
            VITE_API_URL=
            VITE_WS_URL=ws://localhost/ws/predictions
          tags: |
            ghcr.io/${{ github.repository_owner }}/sepsis-frontend:latest
            ghcr.io/${{ github.repository_owner }}/sepsis-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build & push mlflow
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.mlflow
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sepsis-mlflow:latest
            ghcr.io/${{ github.repository_owner }}/sepsis-mlflow:${{ github.sha }}
          cache-from: type=gha,scope=mlflow
          cache-to: type=gha,scope=mlflow,mode=max
